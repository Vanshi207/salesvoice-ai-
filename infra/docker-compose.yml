name: salesvoice

x-calls-env: &calls-env
  DATABASE_URL: postgresql+asyncpg://calls_svc:${CALLS_DB_PASSWORD}@postgres:5432/salesvoice
  REDIS_URL: redis://redis:6379/0
  LEADS_URL: http://leads:8000
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
  LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: salesvoice
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      LEADS_DB_PASSWORD: ${LEADS_DB_PASSWORD}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD}
      CALLS_DB_PASSWORD: ${CALLS_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salesvoice"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  auth:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://auth_svc:${AUTH_DB_PASSWORD}@postgres:5432/salesvoice
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  leads:
    build:
      context: ..
      dockerfile: services/leads/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://leads_svc:${LEADS_DB_PASSWORD}@postgres:5432/salesvoice
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  knowledge:
    build:
      context: ..
      dockerfile: services/knowledge/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://knowledge_svc:${KNOWLEDGE_DB_PASSWORD}@postgres:5432/salesvoice
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  calls:
    build:
      context: ..
      dockerfile: services/calls/Dockerfile
    environment: *calls-env
    volumes:
      - audio:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      leads:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  calls-worker:
    build:
      context: ..
      dockerfile: services/calls/Dockerfile
    command: celery -A app.worker worker --loglevel=INFO --concurrency=2
    environment: *calls-env
    volumes:
      - audio:/data/audio
    depends_on:
      calls:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379/0
      AUTH_URL: http://auth:8000
      LEADS_URL: http://leads:8000
      KNOWLEDGE_URL: http://knowledge:8000
      CALLS_URL: http://calls:8000
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
      leads:
        condition: service_healthy
      knowledge:
        condition: service_healthy
      calls:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  audio:
