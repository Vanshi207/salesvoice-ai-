[project]
name = "salesvoice-common"
version = "0.1.0"
description = "Shared code for all SalesVoice services"
requires-python = ">=3.11"
dependencies = [
  "pydantic-settings>=2.6",
  "pyjwt>=2.9",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
